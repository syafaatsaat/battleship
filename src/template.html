<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BATTLESHIP</title>
  </head>
  <body>
    <div id="crt-overlay"></div>

    <dialog id="main-menu" open>
      <div class="menu-wrapper">
        <p class="title crt-text">BATTLESHIP</p>
        <div id="menu-buttons">
          <button id="pvp-btn">PLAYER VS. PLAYER</button>
          <button id="pvb-btn">PLAYER VS. BOT</button>
        </div>
      </div>
    </dialog>

    <dialog id="pvp-menu">
      <div class="menu-wrapper">
        <p class="title crt-text">PLAYER VS. PLAYER</p>
        <div id="name-form">
          <p>ENTER PLAYER NAMES (BLUE GOES FIRST):</p>
          <div class="form-row">
            <label for="pvp-p1" class="label-blue">BLUE</label>
            <input type="text" id="pvp-p1" name="pvp-p1" placeholder="PLAYER ONE" maxlength="12" />
          </div>
          <div class="form-row">
            <label for="pvp-p2" class="label-red">RED</label>
            <input type="text" id="pvp-p2" name="pvp-p2" placeholder="PLAYER TWO" maxlength="12" />
          </div>
        </div>
        <div class="nav-buttons">
          <button id="back-pvp">BACK</button>
          <button id="start-pvp">START</button>
        </div>
      </div>
    </dialog>

    <dialog id="pvb-menu">
      <div class="menu-wrapper">
        <p class="title crt-text">PLAYER VS. BOT</p>
        <div id="pvb-form">
          <div class="form-row">
            <label for="pvb-player">ENTER YOUR NAME:</label>
            <input type="text" id="pvb-player" name="pvb-player" placeholder="PLAYER" maxlength="12" />
          </div>
          <div class="form-row">
            <p>CHOOSE YOUR COLOR (BLUE GOES FIRST)</p>
            <div class="radio-group">
              <label for="pvb-blue" class="label-blue">
                <input type="radio" id="pvb-blue" name="pvb-color" value="BLUE" checked />
                BLUE
              </label>
              <label for="pvb-red" class="label-red">
                <input type="radio" id="pvb-red" name="pvb-color" value="RED" />
                RED
              </label>
            </div>
          </div>
          <div class="form-row">
            <p>DIFFICULTY</p>
            <div class="radio-group">
              <label for="pvb-easy">
                <input type="radio" id="pvb-easy" name="pvb-difficulty" value="EASY" checked />
                EASY
              </label>
              <label for="pvb-medium">
                <input type="radio" id="pvb-medium" name="pvb-difficulty" value="MEDIUM" />
                MEDIUM
              </label>
              <label for="pvb-hard">
                <input type="radio" id="pvb-hard" name="pvb-difficulty" value="HARD" />
                HARD
              </label>
            </div>
          </div>
        </div>
        <div class="nav-buttons">
          <button id="back-pvb">BACK</button>
          <button id="start-pvb">START</button>
        </div>
      </div>
    </dialog>

    <dialog id="turn-transition">
      <div class="menu-wrapper">
        <p class="title crt-text" id="turn-transition-title">PLAYER ONE'S TURN</p>
        <p id="turn-transition-subtitle">PLACE YOUR SHIPS</p>
        <div class="nav-buttons">
          <button id="confirm-turn">READY</button>
        </div>
      </div>
    </dialog>

    <dialog id="game-over-dialog">
      <div class="menu-wrapper">
        <p class="title crt-text" id="winner-text">WINNER</p>
        <div class="nav-buttons">
          <button id="play-again-btn">PLAY AGAIN</button>
          <button id="main-menu-btn">MAIN MENU</button>
        </div>
      </div>
    </dialog>

    <div id="main-content"></div>
  </body>
</html>
